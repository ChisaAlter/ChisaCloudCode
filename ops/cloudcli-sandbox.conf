# Apply to the two API units only after the matching QA lifecycle checks pass.
# The rootful Docker socket still confers host administration capabilities.
# These restrictions constrain direct API/provider syscalls, not Docker daemon actions.
[Service]
ProtectSystem=full
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
PrivateDevices=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
CapabilityBoundingSet=~CAP_SYS_ADMIN CAP_SYS_MODULE CAP_SYS_RAWIO CAP_SYS_BOOT CAP_SYS_TIME CAP_NET_ADMIN CAP_NET_RAW CAP_MKNOD CAP_SYS_PTRACE CAP_SYSLOG CAP_BPF CAP_PERFMON CAP_CHECKPOINT_RESTORE
